<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحه کپیخور گیم نت احمدی بنک</title>
  <link rel="stylesheet" href="includes/style.css">
</head>
<body>

  <h1>صفحه کپیخور گیم نت احمدی بنک</h1>
  <h3 id="UA">در حال اجرا روی:</h3>

  <hr>

  <div class="btn-container">
    <form id="kernel-options">
      <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
      <label for="netctrl-exploit">NetCtrl</label>
      <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
      <label for="lapse-exploit">Lapse</label>
    </form>
    <button id="jeilbrek">کپیخور کن</button>
    <div class="autoJb">
      <label for="autoJbInput" id="autoJbLabel">کپیخور اتوماتیک</label>
      <input class="mt-2" id="autoJbInput" type="checkbox">
    </div>
  </div>

  <div class="main-layout">
    <div class="media-box">
      <img src="includes/cat.jpg" alt="A cat staring at you">
    </div>

    <pre id="console">اماده کپیخور شدن. Awaiting execution...
  </pre>


  </div>

  <script src="src/main.js"></script>
  <script src="includes/script.js"></script>
</body>

</html>
